name: Build & Release (jovi-dev)

# 触发：推送到 jovi-dev（上游同步合并后会自动触发）、或手动点击 Run workflow
on:
  push:
    branches:
      - jovi-dev
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  Android:
    name: Build APK
    runs-on: ubuntu-latest
    # 防自触发死循环：GitHub Actions 不认 [skip ci] 提交信息，故靠 if 守卫——
    # 仅手动触发、或提交信息不含 "skip ci"（即上游同步的提交）时才构建，自身 push 的 skip ci 提交会被跳过
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'skip ci')
    outputs:
      package_version: ${{ steps.vars.outputs.package_version }}
      new_code: ${{ steps.vars.outputs.new_code }}
      build_tag: ${{ steps.vars.outputs.build_tag }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Env (Node / Java / npm ci)
        uses: ./.github/actions/setup

      # 关键：把私有 fork 的车机歌词(uCar/ICCOA)补丁打进 node_modules
      - name: Patch react-native-track-player (uCar metadata)
        run: node dependencies-patch.js

      # 手动安装 Android SDK/NDK：
      # setup-android@v3 内部写死 `sdkmanager tools`，而 runner 的 cmdline-tools(16.0) 已移除该包，
      # 必报 "Failed to find package 'tools'" 并退出 1。改用手动安装官方 cmdline-tools，干净可控。
      - name: Setup Android SDK & NDK
        run: |
          ANDROID_SDK_ROOT=/home/runner/android-sdk
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;26.1.10909125" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Compute version & bump versionCode
        id: vars
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          # versionCode 用 Unix 秒级时间戳：严格单调递增、与本次构建天然一一对应，
          # 避免「读旧值 +1」在多次并发/时序错位时，出现 apkUrl 与 versionCode 不一致、
          # 进而导致「当前版本高于下载版本，无法安装」的问题。
          NEW_CODE=$(date +%s)
          BUILD_TAG="v${PACKAGE_VERSION}-${GITHUB_SHA::7}"
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p));j.versionCode=${NEW_CODE};fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "new_code=$NEW_CODE" >> $GITHUB_OUTPUT
          echo "build_tag=$BUILD_TAG" >> $GITHUB_OUTPUT
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Build Packages
        env:
          DISABLE_SVG: 1
          STORE_FILE_BASE64: ${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          STORE_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PWD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        shell: bash
        run: |
          cd android
          # 预检：缺失任何密钥直接报错并指明缺哪个，避免晦涩失败
          : "${STORE_FILE_BASE64:?❌ 缺少密钥 KEYSTORE_STORE_FILE_BASE64（用 Git Bash 跑 base64 -w0 my-release-key.jks 生成）}"
          : "${KEY_ALIAS:?❌ 缺少密钥 KEYSTORE_KEY_ALIAS（应填 myKeyAlias）}"
          : "${STORE_PWD:?❌ 缺少密钥 KEYSTORE_PASSWORD（keystore 密码）}"
          : "${KEY_PWD:?❌ 缺少密钥 KEYSTORE_KEY_PASSWORD（密钥密码）}"
          # 注意：app/build.gradle 里 storeFile file(MYAPP_UPLOAD_STORE_FILE) 是相对 app 模块目录(android/app/)解析的，
          # 传相对名会去 android/app/ 找而报 "Keystore file ... not found"。这里统一用绝对路径，彻底避免歧义。
          KS_PATH="$PWD/my-release-key.jks"
          echo "$STORE_FILE_BASE64" | base64 --decode > "$KS_PATH"
          ./gradlew assembleRelease -PMYAPP_UPLOAD_STORE_FILE="$KS_PATH" -PMYAPP_UPLOAD_KEY_ALIAS="$KEY_ALIAS" -PMYAPP_UPLOAD_STORE_PASSWORD="$STORE_PWD" -PMYAPP_UPLOAD_KEY_PASSWORD="$KEY_PWD"
          rm -f "$KS_PATH"

      - name: Generate file MD5
        run: |
          cd android/app/build/outputs/apk/release
          md5sum *.apk

      - name: Upload Artifact
        uses: ./.github/actions/upload-artifact
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}

  Release:
    name: Release & OTA
    runs-on: ubuntu-latest
    needs: [Android]
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'skip ci')
    env:
      PACKAGE_VERSION: ${{ needs.Android.outputs.package_version }}
      BUILD_TAG: ${{ needs.Android.outputs.build_tag }}
      NEW_CODE: ${{ needs.Android.outputs.new_code }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Generate file MD5
        run: |
          echo -e '\n### File MD5\n```' >> ./publish/changeLog.md
          cd artifacts
          md5sum *.apk >> ../publish/changeLog.md
          echo -e '```\n' >> ../publish/changeLog.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ./publish/changeLog.md
          prerelease: false
          draft: false
          tag_name: ${{ env.BUILD_TAG }}
          files: |
            artifacts/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-arm64-v8a.apk
            artifacts/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-armeabi-v7a.apk
            artifacts/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-x86_64.apk
            artifacts/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-x86.apk
            artifacts/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 自动回写 OTA：version 用「主版本.构建号」保证恒大于本机；apkUrl 指向本次 Release 的 universal 包
      - name: Update OTA metadata
        run: |
          OTA_VER="${{ env.PACKAGE_VERSION }}.${{ env.NEW_CODE }}"
          OTA_URL="https://github.com/zb463816216/lx-music-mobile/releases/download/${{ env.BUILD_TAG }}/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-universal.apk"
          node -e "const fs=require('fs');const p='ota/update.json';const j=JSON.parse(fs.readFileSync(p));j.version=process.env.OTA_VER;j.versionCode=Number(process.env.OTA_CODE);j.apkUrl=process.env.OTA_URL;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
        env:
          OTA_VER: ${{ env.PACKAGE_VERSION }}.${{ env.NEW_CODE }}
          OTA_CODE: ${{ env.NEW_CODE }}
          OTA_URL: https://github.com/zb463816216/lx-music-mobile/releases/download/${{ env.BUILD_TAG }}/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-universal.apk

      # 把本构建使用的 versionCode 写回 package.json 并提交，否则下一轮仍从旧值 +1，导致 APK versionCode 不累加、
      # 用户已装旧版时系统拒绝覆盖安装（OTA 提示有更新却装不上）
      - name: Persist versionCode
        run: |
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p));j.versionCode=${{ needs.Android.outputs.new_code }};fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"

      - name: Commit OTA & versionCode [skip ci]
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 只提交 OTA 元数据与 versionCode，绝不能 git add -A（否则会把 artifacts/ 里的 APK 一起提交进仓库）
          git add package.json ota/update.json
          git commit -m "chore: bump versionCode & update OTA [skip ci]" || echo "nothing to commit"
          git push
